name: SD Native Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "sd-android-native-research/**"
      - ".github/workflows/sd-android-native-research.yml"
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sd-android-native-research
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME" -name sdkmanager -type f | head -5
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build ARM64 debug APK
        run: sh ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sd-native-debug-apk
          path: sd-android-native-research/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
