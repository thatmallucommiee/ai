name: Remote Drive Header Inspection

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file ID (not a password or private token)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch archive header, handling Drive confirmation
        env:
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DRIVE_FILE_ID" =~ ^[A-Za-z0-9_-]{10,200}$ ]]; then
            echo "Invalid Drive file ID format."
            exit 1
          fi

          URL="https://drive.google.com/uc?export=download&id=$DRIVE_FILE_ID"
          curl -sS -L -c cookies.txt -b cookies.txt --max-time 90 -o response.bin -w 'Initial HTTP status: %{http_code}\n' "$URL"
          echo "Initial response bytes: $(wc -c < response.bin)"

          if head -c 1000 response.bin | grep -aq 'Google Drive - Virus scan warning'; then
            echo "Drive returned a virus-scan confirmation page. Parsing form fields and cookies."
            python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, parse_qs
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inputs = []
                  self.action = None
                  self.in_form = False
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "form":
                      self.in_form = True
                      self.action = a.get("action")
                  elif tag == "input":
                      self.inputs.append(a)
          p = Parser()
          p.feed(open("response.bin", encoding="utf-8", errors="replace").read())
          print("Form action:", p.action or "(none)")
          for item in p.inputs:
              name = item.get("name", "")
              if name in ("confirm", "id", "uuid", "export", "at"):
                  print("Form field:", name, "=", item.get("value", ""))
          with open("confirm.env", "w") as f:
              f.write("FORM_ACTION=" + (urljoin("https://drive.google.com/", p.action or "/uc") ) + "\n")
              for item in p.inputs:
                  name = item.get("name", "")
                  if name in ("confirm", "id", "uuid", "export", "at") and item.get("value"):
                      f.write("FIELD_" + name.upper() + "=" + item["value"] + "\n")
          PY
            source confirm.env
            CONFIRM="${FIELD_CONFIRM:-t}"
            ACTION="${FORM_ACTION:-https://drive.google.com/uc}"
            echo "Retrying confirmation request with preserved cookies."
            curl -sS -L -c cookies.txt -b cookies.txt --get "$ACTION" \
              --data-urlencode "export=download" \
              --data-urlencode "id=$DRIVE_FILE_ID" \
              --data-urlencode "confirm=$CONFIRM" \
              --range 0-63 --max-time 120 -o header.bin -w 'Confirmed HTTP status: %{http_code}\n'
          else
            mv response.bin header.bin
          fi

          echo "Bytes received on final request: $(wc -c < header.bin)"
          file header.bin || true
          echo "First bytes (hex):"
          od -An -tx1 -N64 header.bin
          echo "First bytes (ASCII):"
          od -An -tc -N64 header.bin
          if head -c 1000 header.bin | grep -aqE 'Google Drive - Virus scan warning|accounts.google.com'; then
            echo "ERROR: Still received a confirmation/login page, not archive bytes."
            echo "The Drive download endpoint may require a different flow or be restricted."
            exit 1
          fi
          rm -f response.bin header.bin cookies.txt confirm.env
